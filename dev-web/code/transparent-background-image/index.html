<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置半透明的背景图片</title>
  <style>
    div {
      position: relative;
      width: 300px;
      height: 300px;
    }

    div::before {
      position: absolute;
      content: "";
      display: block;
      width: 300px;
      height: 300px;
      background-image: url(./cat.jpg);
      opacity: 0.2;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div>
    <h1>这是一只猫猫</h1>
    <h2>^ↀᴥↀ^</h2>
    <p>设置半透明的背景图片</p>
  </div>
</body>
</html>
