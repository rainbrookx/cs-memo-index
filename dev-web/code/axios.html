<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Axios (Vue2)</title>
  <script src="https://cdn.staticfile.net/vue/2.4.2/vue.min.js"></script>
  <script src="https://cdn.staticfile.net/axios/0.18.0/axios.min.js"></script>
</head>

<body>
  <div id="app">
    <div v-if="wtf != null">
      <h1>{{ wtf.answer }}</h1>
      <img :src="wtf.image" alt="" style="width: 400px;">
    </div>
    <p v-else>加载中...</p>
  </div>
  <script type="text/javascript">
    new Vue({
      el: '#app',
      data: {
        wtf: null
      },
      mounted() {
        axios.defaults.baseURL = 'https://yesno.wtf';
        axios.get("/api")
          .then((res) => {
            console.log(res.data)
            this.wtf = res.data
          })
      }
    })
  </script>
</body>

</html>
