<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    :root {
      --left: #f00;
      --right: #fff;
    }

    .box {
      display: flex;
      width: 150px;
      height: 25px;
      text-align: center;
      line-height: 25px;
      border: 2px solid var(--left);
    }

    .box div {
      width: 50%;
    }

    .box .left {
      position: relative;
      color: var(--right);
      font-weight: 700;
      background-color: var(--left);
    }

    .box .left::after {
      position: absolute;
      top: 0;
      right: 0;
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-color: transparent var(--right) transparent transparent;
      border-style: solid;
      border-width: 25px 15px 0 0;
    }

    .box .right {
      font-size: 14px;
      color: #666;
      text-decoration: line-through;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="left">￥100</div>
    <div class="right">￥220</div>
  </div>
</body>

</html>
